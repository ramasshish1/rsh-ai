<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSH-AI Viral Title Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f4f4f9;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: inline-block;
      max-width: 400px;
      width: 100%;
    }

    input {
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #ff4757;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #e84118;
    }

    .result {
      margin-top: 20px;
      text-align: left;
    }

    .title-card {
      background: #e1f5fe;
      padding: 10px;
      margin: 8px 0;
      border-left: 5px solid #03a9f4;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>🔥 Viral Title Generator</h2>
    <p>Apna video topic yahan likhein:</p>

    <input type="text" id="topicInput" placeholder="Jaise: Cartoon Story...">
    <button onclick="generateTitles()">Generate</button>

    <div class="result" id="results"></div>
  </div>

  <script>
    function generateTitles() {
      let topic = document.getElementById("topicInput").value.trim();
      let resDiv = document.getElementById("results");

      if (topic === "") {
        alert("Kuch likho toh sahi!");
        return;
      }

      resDiv.innerHTML = `
        <div class="title-card">1️⃣ Ye <b>${topic}</b> dekh ke dimag hil jayega 😱</div>
        <div class="title-card">2️⃣ <b>${topic}</b> ka ye sach koi nahi batata 🤯</div>
        <div class="title-card">3️⃣ Agar tum <b>${topic}</b> pasand karte ho to ye video miss mat karo 🔥</div>
      `;
    }
  </script>

</body>
</html>
