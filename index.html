<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSH-AI Viral Title Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    input {
      padding: 12px;
      width: 100%;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px;
      border: none;
      background: #ff4757;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px 3px;
    }

    button.reset {
      background: #57606f;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 20px;
      text-align: left;
    }

    .title-card {
      background: #e1f5fe;
      padding: 10px;
      margin: 8px 0;
      border-left: 5px solid #03a9f4;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>🔥 Rsh Ai Generator</h2>
    <p>Apna video topic yahan likhein:</p>

    <input type="text" id="topicInput" placeholder="Jaise: Cartoon Story">

    <button type="button" onclick="generateTitles()">Generate</button>
    <button type="button" class="reset" onclick="resetAll()">Reset</button>

    <div class="result" id="results"></div>
  </div>

  <script>
    function generateTitles() {
      const topicInput = document.getElementById("topicInput");
      const topic = topicInput.value.trim();
      const resDiv = document.getElementById("results");

      if (topic === "") {
        alert("Kuch likho toh sahi!");
        topicInput.focus();
        return; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 
      }

      `resDiv.innerHTML =``
        <div class="title-card">1️⃣ Ye </b>${topic}</b> dekh ke dimag hil jayega 😱</div>
        <div class="title-card">2️⃣ </b>${topic}</b> ka ye sach koi nahi batata 🤯</div>
        <div class="title-card">3️⃣ Agar tum <b>${topic}</b> pasand karte ho to ye video miss mat karo 🔥</div>
      `**;`.
    }

    function resetAll() {
      document.getElementById("topicInput").value = "";
      document.getElementById("results").innerHTML = "";
      document.getElementById("topicInput").focus();
    }
  </script>

</body>
</html>
